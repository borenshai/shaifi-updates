<style>
/* ShaiFi. Layout: the header is the cover of the current book (full-bleed band in its ink),
   quiet white sheets with hairline rules below, a four-tab bar at the bottom. RTL, phone first. */
:root{
  --paper:#EDF0EE; --sheet:#FFFFFF; --sheet-2:#F4F6F5; --rule:#DCE2DE;
  --ink:#17211D; --ink-2:#4B5852; --ink-3:#5F6B65;
  --pine:#0E6B5C; --plum:#7E4472; --navy:#2C4A9A; --graphite:#26302C;
  --pine-t:#0E6B5C; --plum-t:#7E4472; --navy-t:#2C4A9A; --graphite-t:#26302C;
  --on-cover:#FFFFFF; --on-cover-2:rgba(255,255,255,.78); --cover-track:rgba(255,255,255,.22);
  --good:#1A7A47; --warn:#9A5A00; --bad:#B3362C;
  --cover:var(--graphite); --acc:var(--graphite); --acc-t:var(--graphite-t);
  --f-serif:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-sans:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r-sheet:16px; --r-ctl:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1412; --sheet:#161D1A; --sheet-2:#1D2622; --rule:#2A3530;
  --ink:#E6EDEA; --ink-2:#AEBBB5; --ink-3:#97A49E;
  --pine:#105A4D; --plum:#653659; --navy:#263F82; --graphite:#1F2825;
  --pine-t:#5CC7B0; --plum-t:#D9A1CB; --navy-t:#A3B6FF; --graphite-t:#E6EDEA;
  --good:#52C487; --warn:#E3A23F; --bad:#F2837A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1412; --sheet:#161D1A; --sheet-2:#1D2622; --rule:#2A3530;
  --ink:#E6EDEA; --ink-2:#AEBBB5; --ink-3:#97A49E;
  --pine:#105A4D; --plum:#653659; --navy:#263F82; --graphite:#1F2825;
  --pine-t:#5CC7B0; --plum-t:#D9A1CB; --navy-t:#A3B6FF; --graphite-t:#E6EDEA;
  --good:#52C487; --warn:#E3A23F; --bad:#F2837A; color-scheme:dark}
body[data-world="p"]{--cover:var(--pine);--acc:var(--pine);--acc-t:var(--pine-t)}
body[data-world="b"]{--cover:var(--plum);--acc:var(--plum);--acc-t:var(--plum-t)}
body[data-world="x"]{--cover:var(--navy);--acc:var(--navy);--acc-t:var(--navy-t)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.55;direction:rtl;margin:0;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,.amt{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- cover ---------- */
#cover{background:var(--cover);color:var(--on-cover);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 24px 24px;transition:background-color .35s ease}
#cover .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{font-family:var(--f-serif);font-size:24px;font-weight:700;letter-spacing:.2px;line-height:1}
.top-acts{display:flex;gap:6px;align-items:center}
.sample{font-size:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:var(--on-cover);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:rgba(0,0,0,.18);padding:3px;border-radius:14px}
.worlds button{border:0;background:transparent;border-radius:11px;padding:8px 2px;font-weight:600;font-size:14px;color:var(--on-cover-2);white-space:nowrap}
.worlds button[aria-pressed="true"]{background:var(--on-cover);color:var(--cover)}
.hero{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.hero .label{font-size:14px;color:var(--on-cover-2)}
.hero .big{font-family:var(--f-serif);font-size:46px;font-weight:700;line-height:1.05;direction:ltr;text-align:right;letter-spacing:-.5px}
.hero .sub{font-size:13px;color:var(--on-cover-2)}
.meter{position:relative;height:8px;background:var(--cover-track);border-radius:999px;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--on-cover);border-radius:999px}
.meter .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--on-cover);opacity:.9;border-radius:2px}
.meter.warn i{background:#FFD08A} .meter.bad i{background:#FFB1A8}
.figs{display:flex;gap:22px;margin-top:8px}

/* ---------- money ---------- */
function toILS(t){ return t.amount*t.ilsRate; }
function toUSD(t){ return t.amount*t.usdRate; }
function inWorldCur(t,w){ return w==="x" ? toUSD(t) : toILS(t); }
function fmt(n,cur,opt){ cur=cur||"ILS";
  try{ return new Intl.NumberFormat("he-IL",Object.assign({style:"currency",currency:cur,maximumFractionDigits:Math.abs(n)>=1000?0:2,minimumFractionDigits:Math.abs(n)>=1000?0:2},opt||{})).format(n).replace(/[\u200e\u200f]/g,""); }
  catch(e){ return (cur==="USD"?"$":"₪")+n.toFixed(2); } }
function fmt2(n,cur){ return fmt(n,cur,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function worldCur(w){ return w==="x"?"USD":"ILS"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const HEB_M=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
function monthKey(d){ return d.slice(0,7); }
function monthName(k){ return HEB_M[Number(k.slice(5,7))-1]; }
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(d){ const [y,m,dd]=d.split("-"); return Number(dd)+" ב"+HEB_M[Number(m)-1]+(y===String(new Date().getFullYear())?"":" "+y); }

/* ---------- derived ---------- */
function txOf(w){ return S.tx.filter(t=> w==="all" ? true : t.world===w); }
function inbox(w){
  const items=[];
  S.tx.forEach(t=>{ if(!t.world && isPnl(t)) items.push({kind:"classify",t}); });
  S.tx.forEach(t=>{ if((t.world==="b"||t.world==="x") && t.kind==="expense" && t.receipt==="none" && Math.abs(toILS(t))>=S.settings.receiptMin) items.push({kind:"receipt",t}); });
  // duplicate charges: same desc+amount+date
  const seen={}; S.tx.forEach(t=>{ if(t.extId) return; const k=[t.date,t.billDate||"",t.desc,t.amount,t.account,t.instNo||""].join("|"); if(seen[k] && !t.dupOk) items.push({kind:"dup",t}); seen[k]=1; });
  const filtered = w==="all" ? items : items.filter(i=> i.kind==="classify" || i.t.world===w);
  return filtered.sort((a,b)=> b.t.date.localeCompare(a.t.date));
}
function guessCat(t,w){
  const d=t.desc.toLowerCase();
  const map = w==="x" ? [["uber","Travel"],["el al","Travel"],["marriott","Travel"],["hotel","Travel"],["aroma","Meals"],["wolt","Meals"],["cafe","Meals"],["zoom","Software"],["notion","Software"],["google","Software"],["office","Office & Coworking"],["wework","Office & Coworking"]]
    : w==="b" ? [["canva","ציוד ותוכנה"],["adobe","ציוד ותוכנה"],["notion","ציוד ותוכנה"],["office","ציוד ותוכנה"],["העברה נכנסת","הכנסה מפרויקט"]]
    : [["שופרסל","מזון וסופר"],["רמי לוי","מזון וסופר"],["wolt","מסעדות וקפה"],["aroma","מסעדות וקפה"],["קפה","מסעדות וקפה"],["פז","תחבורה ודלק"],["סלקום","תקשורת"],["netflix","מנויים"],["zoom","מנויים"],["notion","מנויים"],["העברה נכנסת","הכנסה"]];
  for(const [k,c] of map) if(d.includes(k)) return c;
  return CATS[w][CATS[w].length-1];
}
function applyRules(t){
  const d=t.desc.toLowerCase();
  for(const r of S.rules){ if(ruleHit(t.desc,r.match)){ t.world=r.world; t.category=r.category; t.receipt=(r.world==="p")?"na":(t.receipt==="na"?"none":t.receipt); return true; } }
  return false;
}
function classify(t,w,cat){
  t.world=w; t.category=cat||guessCat(t,w);
  if(w==="p") t.receipt="na"; else if(t.amount<0 && t.receipt==="na") t.receipt="none";
  if(t.amount>0) t.receipt="na";
}

/* ---------- Riseup-style monthly flow: fixed, monitored and variable spending ---------- */
const MONITORED=["מזון וסופר","תחבורה ודלק","מסעדות וקפה"];
function addMonths(mk,d){ const [y,m]=mk.split("-").map(Number); const dt=new Date(y,m-1+d,1); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0"); }
function riseFlow(){
  const w="p", mk=monthKey(todayKey()), prev=[1,2,3].map(i=>addMonths(mk,-i));
  const tx=txOf(w).filter(isPnl), sum=(l)=>l.reduce((a,t)=>a+inWorldCur(t,w),0);
  const cur=tx.filter(t=>monthKey(t.date)===mk);
  const histMonths=prev.filter(k=>tx.some(t=>monthKey(t.date)===k));
  if(histMonths.length<2) return null;
  const series={};
  tx.forEach(t=>{ const k=(t.amount<0?"-":"+")+normDesc(t.desc); if(k.length<3) return; (series[k]=series[k]||[]).push(t); });
  const fixedExp=[], fixedInc=[];
  for(const [key,list] of Object.entries(series)){
    const inc=key[0]==="+", cat=list[list.length-1].category;
    if(!inc && MONITORED.includes(cat)) continue;
    const amt=k=>Math.abs(sum(list.filter(t=>monthKey(t.date)===k)));
    const have=prev.filter(k=>amt(k)>0); if(have.length<2) continue;
    const vals=have.map(amt), avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    if(Math.max(...vals.map(v=>Math.abs(v-avg)))>avg*0.25+1) continue;
    const days=list.map(t=>Number(t.date.slice(8))).sort((a,b)=>a-b), day=days[Math.floor(days.length/2)];
    const item={key,name:list[list.length-1].desc,cat,expected:avg,actual:amt(mk),day};
    item.paid=item.actual>0; (inc?fixedInc:fixedExp).push(item);
  }
  const isFixed=t=>fixedExp.some(i=>i.key==="-"+normDesc(t.desc));
  const mon=MONITORED.map(cat=>{
    const of=k=>Math.abs(sum(tx.filter(t=>monthKey(t.date)===k&&t.amount<0&&t.category===cat&&!isFixed(t))));
    const vals=prev.map(of).filter(v=>v>0);
    return {cat, expected:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0, actual:of(mk)};
  }).filter(m=>m.expected>0||m.actual>0);
  const isVar=t=>t.amount<0&&!isFixed(t)&&!MONITORED.includes(t.category);
  const incReceived=sum(cur.filter(t=>t.amount>0));
  const incPending=fixedInc.filter(i=>!i.paid).reduce((a,i)=>a+i.expected,0);
  const incExpected=incReceived+incPending;
  const fixedTotal=fixedExp.reduce((a,i)=>a+(i.paid?i.actual:i.expected),0);
  const monTotal=mon.reduce((a,m)=>a+Math.max(m.expected,m.actual),0);
  const goal=S.settings.goal||0;
  const varBudget=incExpected-fixedTotal-monTotal-goal;
  const varSpent=Math.abs(sum(cur.filter(isVar)));
  const left=varBudget-varSpent;
  const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), today=d.getDate();
  const wkStart=Math.max(1,today-d.getDay()), wkStartKey=mk+"-"+String(wkStart).padStart(2,"0");
  const flexThisWeek=Math.abs(sum(cur.filter(t=>t.date>=wkStartKey&&isVar(t))));
  const weeksFromWkStart=Math.max(1,Math.ceil((dim-wkStart+1)/7));
  const week=(left+flexThisWeek)/weeksFromWkStart-flexThisWeek;
  const prevVar=prev.map(k=>Math.abs(sum(tx.filter(t=>monthKey(t.date)===k&&isVar(t))))).filter(v=>v>0);
  const avgVar=prevVar.length?prevVar.reduce((a,b)=>a+b,0)/prevVar.length:varSpent;
  const elapsed=today/dim, varProj=elapsed>=0.3?varSpent/elapsed:varSpent+avgVar*(1-elapsed);
  const forecast=incExpected-fixedTotal-mon.reduce((a,m)=>a+Math.max(m.expected,elapsed>=0.3?m.actual/elapsed:m.expected),0)-varProj;
  const upcoming=fixedExp.filter(i=>!i.paid&&i.day>=today).sort((a,b)=>a.day-b.day);
  return {mk,fixedExp,fixedInc,mon,incReceived,incExpected,incPending,fixedTotal,monTotal,goal,varBudget,varSpent,left,week,forecast,upcoming,
    varList:cur.filter(isVar).sort((a,b)=>a.amount-b.amount),
    varIncome:cur.filter(t=>t.amount>0&&!fixedInc.some(i=>i.key==="+"+normDesc(t.desc)))};
}

function heroView(){
  const w=view.world, mk=monthKey(todayKey());
  const month=txOf(w).filter(t=>monthKey(t.date)===mk && isPnl(t));
  const out=month.filter(t=>t.amount<0).reduce((a,t)=>a-inWorldCur(t,w),0);
  const inc=month.filter(t=>t.amount>0).reduce((a,t)=>a+inWorldCur(t,w),0);
  const fig=(k,v)=>`<div class="fig"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  if(w==="p"){
    const R=riseFlow();
    if(R){

      const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), pace=(d.getDate()-.5)/dim*100;
      const sub=R.left<0?`חריגה של <span class="num">${fmt(-R.left,"ILS")}</span> בהוצאות המשתנות`:`השבוע נשאר להוציא <span class="num">${fmt(Math.max(0,Math.round(R.week)),"ILS",{maximumFractionDigits:0,minimumFractionDigits:0})}</span>`;

        <div class="meter ${R.left<0?'bad':pct>pace+8?'warn':''}" role="img" aria-label="יצאו ${Math.round(pct)} אחוז מתקציב המשתנות, עברו ${Math.round(pace)} אחוז מהחודש"><i style="width:${pct}%"></i><span class="pace" style="inset-inline-start:${pace}%"></span></div>
        <span class="sub">${sub}</span>
        <div class="figs">${fig("צפי לסוף החודש",fmt(Math.round(R.forecast),"ILS",{maximumFractionDigits:0,minimumFractionDigits:0,signDisplay:"exceptZero"}))}${fig("קבועות שעוד צפויות",String(R.upcoming.length))}${R.goal?fig("יעד חיסכון",fmt(R.goal,"ILS")):fig("הכנסות צפויות",fmt(Math.round(R.incExpected),"ILS",{maximumFractionDigits:0,minimumFractionDigits:0}))}</div></section>`;
    }
    const B=S.settings.budget, left=B-out, pct=Math.min(100,Math.max(0,out/B*100));
    const d=new Date(), dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), pace=(d.getDate()-.5)/dim*100, daysLeft=dim-d.getDate()+1;
    const verdict= left<0?`חריגה של <span class="num">${fmt(-left,"ILS")}</span> מהתקציב`: pct>pace+8?`קצב ההוצאות מהיר מהחודש עד עכשיו`: `בקצב. אפשר להוציא כ-<span class="num">${fmt(Math.round(left/daysLeft),"ILS",{maximumFractionDigits:0,minimumFractionDigits:0})}</span> ליום עד סוף החודש`;
    return `<section class="hero" aria-label="תקציב החודש"><span class="label">נשאר להוציא ב${monthName(mk)}</span><div class="big">${fmt(left,"ILS")}</div>
      <div class="meter ${left<0?'bad':pct>pace+8?'warn':''}" role="img" aria-label="יצאו ${Math.round(pct)} אחוז מהתקציב, עברו ${Math.round(pace)} אחוז מהחודש"><i style="width:${pct}%"></i><span class="pace" style="inset-inline-start:${pace}%"></span></div>
      <span class="sub">${verdict}</span>
      <div class="figs">${fig("יצא",fmt(out,"ILS"))}${fig("תקציב",fmt(B,"ILS"))}${fig("נכנס",fmt(inc,"ILS"))}</div></section>`;
  }
  if(w==="b"){
    const y=todayKey().slice(0,4);
    const ytd=txOf("b").filter(t=>t.date.startsWith(y)&&t.kind==="income").reduce((a,t)=>a+toILS(t),0);
    const C=S.settings.ceiling, pct=Math.min(100,ytd/C*100), rest=C-ytd;

/* ---------- focus triage: one decision at a time ---------- */
let F=null; // {ids:[], i, done, undo}
function haptic(kind){ if(NATIVE) nativeCall("haptic",{kind}).catch(()=>{}); else try{ navigator.vibrate&&navigator.vibrate(kind==="success"?[12,40,12]:10); }catch(e){} }
function openFocus(){
  const items=inbox(view.world); if(!items.length) return;
  F={queue:items.map(i=>({id:i.t.id,kind:i.kind})), i:0, done:0};
  document.body.classList.add("focus-on"); renderFocus();
}
function closeFocus(){ F=null; document.body.classList.remove("focus-on"); document.getElementById("layer").innerHTML=""; render(); }
function renderFocus(){
  const lay=document.getElementById("layer");
  while(F && F.i<F.queue.length){ const q=F.queue[F.i], t=S.tx.find(x=>x.id===q.id);
    const still=t && (q.kind==="classify"? !t.world : q.kind==="receipt"? t.receipt==="none" : !t.dupOk);
    if(still) break; F.i++; }
  const total=F.queue.length;
  if(F.i>=total){
    lay.innerHTML=`<div class="focus" role="dialog" aria-modal="true" aria-label="סיום"><div class="bar"><button class="close" id="fClose" aria-label="סגור">×</button><span class="prog"><i style="width:100%"></i></span><span class="count">${total} מתוך ${total}</span></div>
      <div class="body fade"><div class="merchant">הכל מסודר</div><div class="facts"><span>טיפלת ב-${F.done} ${F.done===1?"החלטה":"החלטות"}.</span><span>מה שסיווגת כאן יעזור לסווג לבד עסקאות דומות בהמשך.</span></div></div>
      <div class="choices"><button class="pick plain" id="fDone">חזרה למסך הבית</button></div></div>`;
    haptic("success");
    document.getElementById("fClose").onclick=closeFocus; document.getElementById("fDone").onclick=closeFocus; return;
  }
  const q=F.queue[F.i], t=S.tx.find(x=>x.id===q.id);
  const facts=[esc(dayLabel(t.date)), esc(t.account)];
  if(t.instNo) facts.push(`תשלום ${t.instNo} מתוך ${t.instTotal}`);
  if(t.origCur&&t.origCur!==t.cur&&t.origAmount!=null) facts.push(`במקור ${esc(fmt2(Math.abs(t.origAmount),t.origCur))}`);
  const ask= q.kind==="classify"?"לאיזה עולם זה שייך?": q.kind==="receipt"?`יש קבלה להוצאה של ${esc(W[t.world].name)}?`:"נראה כמו חיוב כפול. זה תקין?";
  const choices= q.kind==="classify"
    ? `<button class="pick p" data-f="p">שי <small>פרטי</small></button><button class="pick b" data-f="b">שי <small>עוסק פטור</small></button><button class="pick x" data-f="x">Bendix <small>LLC</small></button>`
    : q.kind==="receipt"
    ? `<button class="pick ${t.world}" data-f="have">יש קבלה</button><button class="pick plain" data-f="na">לא נדרשת קבלה</button>`
    : `<button class="pick plain" data-f="ok">זה תקין, שני חיובים שונים</button><button class="pick warnb" data-f="del">מחק את הכפול</button>`;
  lay.innerHTML=`<div class="focus" role="dialog" aria-modal="true" aria-label="החלטה ${F.i+1} מתוך ${total}">
    <div class="bar"><button class="close" id="fClose" aria-label="סגור">×</button><span class="prog"><i style="width:${F.i/total*100}%"></i></span><span class="count">${F.i+1} מתוך ${total}</span></div>
    <div class="body fade"><span class="ask">${ask}</span><div class="merchant">${esc(t.desc)}</div><div class="famt ${t.amount>0?'in':''}">${fmt2(t.amount,t.cur)}</div><div class="facts">${facts.map(f=>`<span>${f}</span>`).join("")}</div></div>
    <div class="choices">${choices}<div class="minor"><button id="fSkip">דלג</button><button id="fMore">פרטים מלאים</button></div></div></div>`;
  document.getElementById("fClose").onclick=closeFocus;
  document.getElementById("fSkip").onclick=()=>{ F.i++; renderFocus(); };
  document.getElementById("fMore").onclick=()=>{ const id=t.id; closeFocus(); openSheet(id); };
  lay.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>focusAct(t,q.kind,b.dataset.f));
}
function focusAct(t,kind,v){
  const snap=JSON.stringify(t), idx=S.tx.indexOf(t);
  let msg="", rule=null;
  if(kind==="classify"){ classify(t,v); msg=`${W[v].name}, ${t.category}`; rule={w:v,word:normDesc(t.desc),cat:t.category}; }
  else if(kind==="receipt"){ t.receipt=v; msg=v==="have"?"סומן שיש קבלה":"סומן שלא נדרשת קבלה"; }
  else if(v==="ok"){ t.dupOk=true; msg="סומן כתקין"; }
  else { S.tx.splice(idx,1); msg="החיוב הכפול נמחק"; }
  F.done++; F.i++; save(); haptic("light"); renderFocus();
  const undo=()=>{ if(kind==="dup"&&v==="del") S.tx.splice(idx,0,sanitize({tx:[JSON.parse(snap)],settings:S.settings}).tx[0]); else Object.assign(t,JSON.parse(snap)); F.done=Math.max(0,F.done-1); F.i=Math.max(0,F.i-1); save(); renderFocus(); };
  toast(msg,{label:"בטל",fn:undo});
  if(rule&&rule.word){ const similar=S.tx.filter(x=>!x.world&&isPnl(x)&&ruleHit(x.desc,rule.word)).length;
    if(similar) setTimeout(()=>toast(`יש עוד ${similar} עסקאות "${rule.word.slice(0,20)}"`,{label:"לסווג גם אותן",fn:()=>{ const n=addRule(rule.word,rule.w,rule.cat); save(); renderFocus(); toast(`נוצר חוק, סווגו עוד ${n}`); }}),900); }
}

const fmt0=n=>fmt(Math.round(n),"ILS",{maximumFractionDigits:0,minimumFractionDigits:0});
const n0=n=>`<span class="num">${fmt0(n)}</span>`;
function riseFlowView(R){
  const row=(name,meta,amt,cls)=>`<div class="tx" style="cursor:default"><span class="mid"><span><bdi>${esc(name)}</bdi></span><span>${esc(meta)}</span></span><span class="amt ${cls||""}">${amt}</span></div>`;

function flowView(){

  const list=txOf(w).filter(isPnl);
  const keys=[...new Set(list.map(t=>monthKey(t.date)))].sort().slice(-6);
  if(!keys.length) return `<div class="card empty"><b>אין עדיין נתונים</b>ייבא קובץ כדי לראות תזרים.</div>`;
  const R=w==="p"?riseFlow():null;
  if(!view.month || !keys.includes(view.month)) view.month=keys[keys.length-1];
  const data=keys.map(k=>{ const m=list.filter(t=>monthKey(t.date)===k);
    return {k, inc:m.filter(t=>t.amount>0).reduce((a,t)=>a+inWorldCur(t,ww),0), out:-m.filter(t=>t.amount<0).reduce((a,t)=>a+inWorldCur(t,ww),0)}; });
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));
  const step=niceStep(max), top=Math.ceil(max/step)*step;

  data.forEach((d,i)=>{ const cx=(Wd-L)-(cw*i+cw/2), sel=d.k===view.month;
    svg+=`<g data-month="${d.k}" style="cursor:pointer"><rect x="${cx-cw/2}" y="${T}" width="${cw}" height="${H-T}" fill="transparent"/>`;
    svg+=`<rect x="${cx+2}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0,y(0)-y(d.inc))}" rx="3" fill="var(--good)" opacity="${sel?1:.45}"/>`;
    svg+=`<rect x="${cx-bw-2}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,y(0)-y(d.out))}" rx="3" fill="var(--acc-t)" opacity="${sel?1:.45}"/>`;
    svg+=`<text x="${cx}" y="${H-8}" font-size="13" text-anchor="middle" fill="${sel?'var(--ink)':'var(--ink-3)'}" font-weight="${sel?600:400}" font-family="IBM Plex Sans Hebrew, sans-serif">${monthName(d.k)}</text></g>`; });
  svg+=`</svg>`;
  const m=list.filter(t=>monthKey(t.date)===view.month && t.amount<0);
  const byCat={}; m.forEach(t=>{ const c=t.world?t.category:"לא מסווג"; byCat[c]=(byCat[c]||0)-inWorldCur(t,ww); });
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const cmax=cats.length?cats[0][1]:1;
  const sel=data.find(d=>d.k===view.month);

/* ---------- encrypted sync file from the PC engine ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptSync(text,pass){
  const o=JSON.parse(text);
  if(!o||o.format!=="shaifi-sync-enc"||o.v!==1||typeof o.ct!=="string") throw new Error("format");
  const iter=Math.min(Math.max(Number(o.iter)||0,200000),5000000);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(o.salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(o.iv),additionalData:new TextEncoder().encode("shaifi-sync-v1")},key,b64(o.ct));
  const data=JSON.parse(new TextDecoder().decode(pt));
  if(!prototypeIntact()) throw new Error("proto");
  if(!data||data.format!=="shaifi-sync"||!Array.isArray(data.txns)) throw new Error("payload");
  return data;
}
function importSync(data){
  const gen=typeof data.generatedAt==="string"?data.generatedAt:new Date().toISOString();
  let pending=0;
  const raw=data.txns.slice(0,50000).filter(t=>{ if(t&&t.status==="pending"){ pending++; return false; } return !!t; }).map(t=>({
    id:uid(), extId:typeof t.extId==="string"?t.extId:null, date:t.date, billDate:t.billDate, amount:Number(t.amount), cur:t.cur, origAmount:t.origAmount, origCur:t.origCur,
    desc:t.desc, account:t.account, instNo:t.instNo, instTotal:t.instTotal, status:"posted", src:"sync", paidBy:"shai", world:null, category:null, receipt:"none",
    kind:detectKind(String(t.desc||""),Number(t.amount),String(t.account||"")) }));
  const clean=sanitize({tx:raw,settings:S.settings}).tx.map(stampRate);
  (Array.isArray(data.accounts)?data.accounts:[]).slice(0,50).forEach(a=>{
    const name=cleanStr(a&&a.name,60).trim(); if(!name) return;
    let acc=S.accounts.find(x=>x.name===name); if(!acc){ acc={name,cur:a.cur==="USD"?"USD":"ILS",yearMax:{}}; S.accounts.push(acc); }
    acc.synced=true; acc.lastSync=gen.slice(0,30);
    const bal=cleanNum(a.balance,null,-1e10,1e10);
    if(bal!=null){ acc.balance=bal; const y=gen.slice(0,4); acc.yearMax=acc.yearMax||{}; const ym=acc.yearMax[y]||{max:bal,last:bal,lastDate:null}; ym.max=Math.max(ym.max,bal); ym.last=bal; ym.lastDate=gen.slice(0,10); acc.yearMax[y]=ym; }
  });
  const importId=uid(); const r=mergeTx(clean,importId);
  save(); view.tab="home"; render();
  toast(`סנכרון: ${r.added} חדשות, ${r.auto} סווגו לבד${r.dups?`, ${r.dups} כבר היו`:""}${pending?`, ${pending} ממתינות לחיוב דולגו`:""}`,{label:"בטל",fn:()=>undoImport(importId)});
}

function toCSV(list){
  const head=["date","description","amount","currency","amount_ils","amount_usd","account","world","category","receipt","reimbursed","note","receipt_link"];
  const q=v=>{ let s=String(v==null?"":v); if(typeof v==="string"&&/^[=+\-@\t\r]/.test(s)&&!/^-?\d+(\.\d+)?$/.test(s)) s="'"+s; return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  return [head.join(",")].concat(list.map(t=>[t.date,t.desc,t.amount,t.cur,toILS(t).toFixed(2),toUSD(t).toFixed(2),t.account,t.world?W[t.world].full:"",t.category||"",t.receipt,t.reimbursed?"yes":"no",t.note||"",t.receiptFile?`https://drive.google.com/file/d/${t.receiptFile}/view`:""].map(q).join(","))).join("\n");
}
function exportText(name,text,mime,label){ if(NATIVE){ nativeCall("share.file",{name,text,mime}).then(()=>{},()=>toast("השיתוף נכשל. נסה שוב.")); return; } copyOut(text,label); }
function copyOut(text,label){
  const o=document.getElementById("out"); o.hidden=false; o.value=text;
  const done=()=>toast(label+" הועתק ללוח");
  try{ navigator.clipboard.writeText(text).then(done,()=>{ o.select(); toast("סמן והעתק מהתיבה"); }); }catch(e){ o.select(); toast("סמן והעתק מהתיבה"); }
}

function escClose(e){ if(e.key==="Escape") closeSheet(); }
function closeSheet(){ document.getElementById("layer").innerHTML=""; document.removeEventListener("keydown",escClose); render(); }
function addRule(match,world,category){
  match=normDesc(match); if(!match) return 0;
  const ex=S.rules.find(r=>r.match===match); if(ex){ ex.world=world; ex.category=category; } else S.rules.push({id:uid(),match,world,category});
  let n=0; S.tx.forEach(t=>{ if(!t.world && isPnl(t) && ruleHit(t.desc,match)){ classify(t,world,category); n++; } });
  return n;
}

/* ---------- toast ---------- */
function toast(msg,action){
  const old=document.querySelector(".toast"); if(old) old.remove(); clearTimeout(toastTimer);
  const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status");
  d.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button>${esc(action.label)}</button>`:"");
  if(action) d.querySelector("button").onclick=()=>{ action.fn(); d.remove(); };
  document.body.appendChild(d); toastTimer=setTimeout(()=>d.remove(), action?6000:2600);
}

  const bio=async()=>{ try{ const r=await nativeCall("key.get"); DEK=await importDek(b64(r.key)); const v=await nativeVaultOpen(); S=await nativeDecrypt(v); afterUnlock(); }catch(e){ DEK=null; const er=document.getElementById("pwErr"); if(er) er.textContent=e.message==="cancel"?"":`הפתיחה בטביעת אצבע לא הצליחה. אפשר לפתוח בסיסמה. (קוד: ${String(e.message).slice(0,40)})`; } };
  const bg=document.getElementById("bioGo"); if(bg) bg.onclick=bio;
  document.getElementById("pwForm").onsubmit=async e=>{ e.preventDefault(); const pass=document.getElementById("pw").value, go=document.getElementById("pwGo"), er=document.getElementById("pwErr");
    go.disabled=true; go.textContent="פותח…";

      const raw=await AESGCMd(kek,b64(v.wrapIv),b64(v.wrapped),WRAP_AAD); DEK=await importDek(raw);
      S=await nativeDecrypt(v); await nativeCall("key.set",{key:u8b64(raw)}).catch(()=>{}); raw.fill(0); afterUnlock(); }
    catch(x){ DEK=null; go.disabled=false; go.textContent="פתיחה בסיסמה"; er.textContent="הסיסמה שגויה."; } };
  if(autoBio&&NATIVE_INFO.bio) bio();
}

      const kek=await importDek(await pbkdfRaw(p1,salt,iter)); const wrapped=await AESGCM(kek,wrapIv,raw,WRAP_AAD);
